[env:ttgo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-displays3
boards_dir = ./boards
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_extra_dirs =
    /home/rami/omat/T-Display-S3/lib
lib_ignore =
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
