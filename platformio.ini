[platformio]
default_envs = ttgo-t-display-s3   ; pio run -t upload lataa vain pelin

[env:ttgo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-displays3
boards_dir = ./boards
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_extra_dirs =
    /home/rami/omat/T-Display-S3/lib
lib_ignore =
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl

; IO-testi: nappien tilat + LEDien ohjaus näytöllä (ei pelilogiikkaa)
[env:iotest]
extends = env:ttgo-t-display-s3
build_src_filter =
    -<*>
    +<../iotest/iotest.cpp>

; IO-kartoitus: selvitä mikä GPIO ohjaa mitäkin lamppua ja mikä on minkäkin nappi
[env:iomap]
extends = env:ttgo-t-display-s3
build_src_filter =
    -<*>
    +<../iomap/iomap.cpp>

; Oikosulkutesti: löytää pinnit jotka ovat kiinni toisissaan, GND:ssä tai jännitteessä
[env:shorttest]
extends = env:ttgo-t-display-s3
build_src_filter =
    -<*>
    +<../shorttest/shorttest.cpp>
